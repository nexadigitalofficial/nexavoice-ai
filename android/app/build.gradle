apply plugin: 'com.android.application'

android {
    namespace "com.seslinotlar.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.seslinotlar.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'seslinotlar123'
            keyAlias 'seslinotlarkey'
            keyPassword 'seslinotlar123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        // Model dosyalarının sıkıştırılmasını engelle (Kaldi doğrudan okur)
        noCompress 'fst', 'mdl', 'conf'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Capacitor Native Çekirdeği
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    }

    // Vosk Offline Ses Tanıma ve JNA
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

try {
    apply from: 'capacitor.build.gradle'
} catch (Exception e) {
    logger.info("capacitor.build.gradle not found, plugins not applied")
}
